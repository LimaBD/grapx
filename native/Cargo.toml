[package]
name = "grapx-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for grapx — high-performance graph algorithms"
authors = ["Bruno Lima <contact@brunolima.dev>"]
license = "MIT"
repository = "https://github.com/LimaBD/grapx"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
petgraph = { version = "0.6", features = ["serde-1"] }
rayon = "1.10"
rustc-hash = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
