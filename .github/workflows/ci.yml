name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Rust linting ──────────────────────────────────────────────────────────────────────
  rust-check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --manifest-path native/Cargo.toml --release

  # ─── Python lint ──────────────────────────────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python lint (ruff)
        run: |
          pip install ruff
          ruff check src/grapx/ tests/

  # ─── Python tests ─────────────────────────────────────────────────────────────────────
  python-tests:
    name: Python tests (Py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust-check, python-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Reduce matrix size: skip older Pythons on non-Linux
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"

      - name: Build grapx wheel
        run: maturin build --release --out dist

      - name: Install test dependencies
        run: pip install pytest pytest-cov "pydantic>=2.0"

      - name: Install grapx wheel
        run: pip install --no-index --find-links dist/ --no-deps grapx

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=grapx --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── Benchmarks (informational, non-blocking) ──────────────────────────────────────
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-cargo-

      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"

      - name: Build grapx wheel
        run: maturin build --release --out dist

      - name: Install benchmark dependencies
        run: pip install "pydantic>=2.0"

      - name: Install grapx wheel
        run: pip install --no-index --find-links dist/ --no-deps grapx

      - name: Run benchmarks
        run: python tests/bench.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.json
        continue-on-error: true
