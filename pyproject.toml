[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "grapx"
version = "0.1.0"
description = "High-performance graph computing with a zero-learning-curve Python API and a Rust core"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Bruno Lima", email = "contact@brunolima.dev" },
]
dependencies = [
    "pydantic>=2.0",
]
keywords = ["graph", "network", "algorithms", "rust", "fast", "performance", "knowledge-graph", "pagerank", "dijkstra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/LimaBD/grapx"
Repository = "https://github.com/LimaBD/grapx"
Documentation = "https://github.com/LimaBD/grapx#readme"
"Bug Tracker" = "https://github.com/LimaBD/grapx/issues"
Changelog = "https://github.com/LimaBD/grapx/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "grapx._core"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]
